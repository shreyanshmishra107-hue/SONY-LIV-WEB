<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>HLS Player</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    body{
      margin:0;
      background:#000;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
    }
    video{
      width:100%;
      max-width:900px;
      height:auto;
      controls:true;
    }
  </style>
</head>
<body>

<video id="video" controls autoplay></video>

<script>
const video = document.getElementById('video');
const url = 'http://filex.me:8080/live/amin007007/nxKYVmQsTZ/1369002.m3u8';

if (Hls.isSupported()) {
    const hls = new Hls();
    hls.loadSource(url);
    hls.attachMedia(video);
} else if (video.canPlayType('application/vnd.apple.mpegurl')) {
    video.src = url;
}
</script>

</body>
</html>
